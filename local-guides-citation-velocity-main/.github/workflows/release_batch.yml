name: Release Batch

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      batch_size:
        description: "How many staged pages to add to LIVE"
        required: true
        default: "5"

permissions:
  contents: write

concurrency:
  group: release-batch
  cancel-in-progress: true

jobs:
  # MAY 2026 MAINTENANCE: Before June 2, 2026, follow README_MAY_2026_GITHUB_ACTIONS_NODE24.md
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Compile staged Reddit query clusters
        run: node scripts/compile_reddit_queries.js

      - name: Release batch
        env:
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '5' }}
        run: node scripts/release_batch.js "$BATCH_SIZE"

      - name: Clean build state
        run: |
          rm -rf .build dist reports data/answer_surface_monitoring

      - name: Build
        run: npm run build

      - name: Validate full published surface
        run: npm run guardrails:all

      - name: Commit and push
        run: |
          rm -rf dist .build reports data/answer_surface_monitoring
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "release batch ($BATCH_SIZE) $(date -u +%F)" || echo "No changes to commit"
          git pull --rebase || true
          git push
