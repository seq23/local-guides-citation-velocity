name: Velocity Full Rebuild

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_OPTIONS: --max-old-space-size=3072

concurrency:
  group: velocity-full-rebuild-main
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Synchronize source before mutation
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main
      - name: Set release date
        run: echo "SOURCE_DATE=$(date -u +%F)" >> "$GITHUB_ENV"
      - name: Build citation intelligence and run deterministic full rebuild
        run: |
          npm run intelligence:build
          npm run release:full-rebuild
      - name: Commit validated rebuild
        id: candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git commit -m "velocity full rebuild $(date -u +%F)"
      - name: Rebase, rebuild, revalidate, and push
        if: ${{ steps.candidate.outputs.changed == 'true' }}
        run: |
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            npm run build
            npm run validate:release
            git add -A
            git commit --amend --no-edit
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 15))
          done
          exit 1
      - name: Upload rebuild diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: velocity-full-rebuild-diagnostics-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            logs/**
            artifacts/validation/**
            reports/**
