name: Velocity Full Rebuild

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_OPTIONS: --max-old-space-size=3072

# Shares the single main-writer group: see query-evidence-refresh.yml. Four
# workflows in this repo push to main and each used to hold its own group,
# which serialises a workflow against itself and not against the branch.
concurrency:
  group: local-guides-main-writer
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      # REFUSE_NON_MAIN: this lane pushes HEAD:main, so a dispatch from any other
      # ref would publish that branch to main. The push target is deliberately
      # literal - the workflow contract asserts it to prove the lane is autonomous
      # - so the ref is gated here instead of making the target dynamic.
      - name: Refuse to release from a non-main ref
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "REFUSED: this lane pushes HEAD:main; refusing to run on $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      # See velocity-content-release.yml for the full rationale: build:cached
      # (scripts/lib/build_cache.js) skips `npm run build` entirely when its
      # input hash matches a prior run, which is exactly the rebase-retry
      # case in the loop below. restore-keys falls back to the most recent
      # entry when this run has no cache of its own yet.
      - name: Restore build-result cache
        uses: actions/cache@v4
        with:
          path: .build-cache
          key: build-result-cache-${{ github.run_id }}
          restore-keys: |
            build-result-cache-
      - name: Synchronize source before mutation
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main
      - name: Set release date
        run: echo "SOURCE_DATE=$(date -u +%F)" >> "$GITHUB_ENV"
      - name: Build citation intelligence and run deterministic full rebuild
        run: |
          npm run intelligence:build
          npm run release:full-rebuild
      - name: Commit validated rebuild
        id: candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git commit -m "velocity full rebuild $(date -u +%F)"
      - name: Rebase, rebuild, revalidate, and push
        if: ${{ steps.candidate.outputs.changed == 'true' }}
        run: |
          # The retry loop was unreachable. `git rebase` is a bare command under
          # `bash -e`, so the first conflicting rebase ended the step and attempts
          # 2 and 3 never ran - the same defect fixed in velocity-content-release.yml
          # on 2026-08-28, still present here because this workflow has never run
          # once and so nothing ever exercised it. It is the recovery workflow, which
          # makes an unreachable retry the worst place for this to sit.
          #
          # Aborting a failed rebase leaves a clean tree so the remaining attempts
          # can actually run. It deliberately does not re-derive the way the
          # absorption step does: the commit being replayed is a full deterministic
          # rebuild, and this workflow's declared failure boundary forbids broad
          # self-healing here.
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              sleep $((attempt * 15))
              continue
            fi
            npm run build:cached:prune
            npm run validate:release
            git add -A
            git commit --amend --no-edit
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 15))
          done
          exit 1
      - name: Upload rebuild diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: velocity-full-rebuild-diagnostics-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            logs/**
            artifacts/validation/**
            reports/**
