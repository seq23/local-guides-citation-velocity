name: Velocity Content Release

on:
  push:
    branches: [main]
    paths:
      - "data/report_fixes/agent_runs/**"
  schedule:
    # After 12:00 PM Central year-round: 18:15 UTC = 12:15 CST / 1:15 CDT.
    - cron: "15 18 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_OPTIONS: --max-old-space-size=3072
  VELOCITY_RELEASE_TARGET: "125"

concurrency:
  group: velocity-content-release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Synchronize source before mutation
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main
      - name: Set release date
        run: echo "SOURCE_DATE=$(date -u +%F)" >> "$GITHUB_ENV"
      - name: Absorb Twin artifacts or social backlog and release Velocity content
        run: npm run release:velocity-intake
      - name: Commit validated Velocity release
        id: candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git commit -m "velocity intake release $(date -u +%F)"
      - name: Rebase, self-heal, revalidate, and push Velocity
        if: ${{ steps.candidate.outputs.changed == 'true' }}
        run: |
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            npm run release:self-healing
            npm run trace:citation-agent-fixes
            npm run validate:citation-agent-fixes
            git add -A
            git commit --amend --no-edit
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 15))
          done
          exit 1
      - name: Upload release diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: velocity-content-release-diagnostics-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            logs/**
            artifacts/validation/**
            data/report_fixes/normalized_agent_runs/**
