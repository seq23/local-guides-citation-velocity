name: CI Health Red Recovery

on:
  workflow_run:
    # Every workflow that pushes to main, plus the validator that governs them.
    #
    # This list was ["Validate Repo"] alone. Velocity Content Release ran red on
    # 2026-09-04, 09-05 and twice on 09-06 while this lane reported SUCCESS at every
    # one of those times - honestly, because Validate Repo really was green and the
    # publishing lane was never in frame. A three-day outage on the surface that
    # publishes raised no alert. ci-health-lane-coverage now fails if a workflow that
    # pushes to main is missing from this list.
    workflows:
      - "Validate Repo"
      - "Velocity Content Release"
      - "Velocity Full Rebuild"
      - "Query Evidence Refresh"
      - "Query Class Occupancy Probe"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  NODE_OPTIONS: --max-old-space-size=3072

concurrency:
  group: ci-health-recovery
  cancel-in-progress: false

jobs:
  record-health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Record exact-SHA CI health and open/close governed alert
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Defaulting this to 'success' meant a manual dispatch - which observes
          # no Validate Repo run at all - recorded RECOVERED and PATCHed the open
          # "[Automation Health] Validate Repo CI RED" issue to closed, with
          # "Recovered on exact SHA " and an empty SHA. Nothing had been
          # validated. A dispatch is now 'unknown', and the script refuses to
          # close an alert on anything but an observed workflow_run success.
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion || 'unknown' }}
          # Which lane the observation belongs to. Health is recorded per workflow, so
          # one lane's green can no longer overwrite another lane's red.
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          WORKFLOW_RUN_URL: ${{ github.event.workflow_run.html_url || format('{0}/{1}/actions', github.server_url, github.repository) }}
        run: node scripts/search_intelligence/ci_health_alert.js
      - name: Upload CI health receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: velocity-ci-health-${{ github.run_id }}
          if-no-files-found: error
          path: data/search_intelligence/automation_health.json
