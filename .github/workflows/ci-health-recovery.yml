name: CI Health Red Recovery

on:
  workflow_run:
    workflows: ["Validate Repo"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  NODE_OPTIONS: --max-old-space-size=3072

concurrency:
  group: ci-health-recovery
  cancel-in-progress: false

jobs:
  record-health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Record exact-SHA CI health and open/close governed alert
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Defaulting this to 'success' meant a manual dispatch - which observes
          # no Validate Repo run at all - recorded RECOVERED and PATCHed the open
          # "[Automation Health] Validate Repo CI RED" issue to closed, with
          # "Recovered on exact SHA " and an empty SHA. Nothing had been
          # validated. A dispatch is now 'unknown', and the script refuses to
          # close an alert on anything but an observed workflow_run success.
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion || 'unknown' }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          WORKFLOW_RUN_URL: ${{ github.event.workflow_run.html_url || format('{0}/{1}/actions', github.server_url, github.repository) }}
        run: node scripts/search_intelligence/ci_health_alert.js
      - name: Upload CI health receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: velocity-ci-health-${{ github.run_id }}
          if-no-files-found: error
          path: data/search_intelligence/automation_health.json
