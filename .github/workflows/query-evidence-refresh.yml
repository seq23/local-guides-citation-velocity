name: Query Evidence Refresh

# Closes the loop the query atlas was missing.
#
# The atlas is evidence-gated - a query only earns a page if it carries demand
# evidence - but nothing ever produced T1 (measured) evidence. The evidence file
# held 5 hand-seeded modelled rows and no process refreshed it, so the site was
# published against guesses while real query data sat unread in Search Console.
#
# This ingests what people actually searched, rebuilds the atlas from it, and
# commits only if validation passes.

# Scheduled and allowed to commit. workflow_contract_registry.json names this
# file in allowed_scheduled_mutation_workflows; the cap was 0 while every change
# arrived through an external agent-run manifest. It commits only if the full
# validation chain passes in the same run.
on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Search Console lookback window in days"
        required: false
        default: "90"
        type: string

permissions:
  contents: write
  # Needed only to hand the finished candidate set to Velocity Content Release.
  # A push made with GITHUB_TOKEN raises no push event, so the commit this
  # workflow lands can never trigger the release workflow that consumes it;
  # workflow_dispatch is the one documented exception to that rule and is the
  # link that lets measured demand reach publishing without a human.
  actions: write

concurrency:
  group: query-evidence-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: --max-old-space-size=3072

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts
      - name: Install Search Console client
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth >/dev/null

      - name: Ingest measured queries from Search Console
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          GSC_LOOKBACK_DAYS: ${{ inputs.lookback_days || '90' }}
        run: python3 scripts/queries/ingest_gsc_evidence.py

      - name: Measure citation occupancy for the panel and the measured atlas head
        # Runs BEFORE the atlas build, because the atlas consumes this file as its
        # winnability signal. Allowed to fail without killing the lane: a failed
        # measurement leaves the previous committed occupancy file in place, which
        # is a stale reading, not a false zero. The probe itself never writes a
        # zero for a degraded probe.
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: npm run probe:occupancy -- data/signals/query_class_probe_panel.json data/signals/query_class_occupancy.json --atlas-top 20 --merge

      - name: Rebuild the query atlas from refreshed evidence
        run: npm run atlas:build

      - name: Join measured demand to the release queue
        # This is the edge that did not exist. The atlas was built on a schedule
        # and read by nobody: every release-queue row carried
        # source=twin_agent_artifact and the release workflow only fired when a
        # human pushed an agent-run manifest - 5 runs and 8 pages since June.
        # The join emits page candidates ranked by measured citation occupancy;
        # the release law downstream still decides what may actually publish.
        run: npm run queries:join-release

      - name: Observe whether answer engines cite us
        # The probe shipped in seven repos and was invoked by none, so no
        # citation observation was ever taken. Grounded mode reads the pages
        # the answer was actually built from; knowledge mode would only show
        # whether a model memorised the brand, which is not a citation.
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CITATION_PROBE_MODE: grounded
        run: node scripts/llm_citation_probe.mjs --limit 25
      - name: Apply bounded self-healing repairs
        id: selfheal
        # selfheal and selfheal:dry shipped here and no workflow invoked either,
        # so the loop never ran. It runs in this lane rather than a new one
        # because the contract allows exactly one scheduled workflow to commit
        # to main, and this is it. The validate step below is what makes the
        # repair safe: nothing is committed unless the repo validates after it.
        #
        # The runner replaces two bare npm calls. Under the default bash -e those
        # aborted the step whenever selfheal:dry exited non-zero, which it does
        # precisely when there is something to repair - so the real pass only ever
        # ran when there was nothing to do. The runner also derives this lane's
        # commit surface from the registry's repair_writes and stops the run if a
        # repair touched anything outside it, so the lane can no longer validate
        # one tree and commit another.
        run: node scripts/selfheal/run_lane_selfheal.mjs
      - name: Validate before publishing anything
        run: npm run validate

      - name: Commit refreshed evidence, atlas and candidates
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "query evidence refresh: measured GSC demand -> atlas -> release candidates"
          file_pattern: ${{ steps.selfheal.outputs.file_pattern }}

      - name: Hand measured candidates to Velocity Content Release
        # Only when the join actually produced candidates. A run that named a
        # legitimate stop - no query has a measured occupancy reading yet, or
        # every candidate was held by an admission rule - dispatches nothing and
        # says so, rather than waking the release lane to do nothing.
        if: ${{ always() && steps.commit.outputs.changes_detected == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(node -e 'try{console.log((require("./data/queries/measured_demand_candidates.json").candidates||[]).length)}catch{console.log(0)}')
          if [ "$COUNT" -gt 0 ]; then
            echo "measured demand produced $COUNT candidate(s); dispatching Velocity Content Release"
            gh workflow run velocity-content-release.yml --ref main
          else
            REASON=$(node -e 'try{console.log(require("./data/queries/measured_demand_candidates.json").stop_reason||"unstated")}catch{console.log("candidates file unreadable")}')
            echo "no candidates this run; not dispatching. Named stop: $REASON"
          fi

      - name: Upload evidence snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: query-evidence-${{ github.run_id }}
          path: |
            data/queries/evidence/evidence_queries.json
            data/authority_scale/query_atlas.json
          if-no-files-found: ignore
