name: Search Outcomes Weekly

# One place that answers "is the search work helping" across the portfolio.
# Start Wednesday at 00:08 UTC to give the 08:15 Central email time to receive
# the artifact. In November 2026, GitHub delivered scheduled events up to 11h26m
# late. Keep the start off the hour and well ahead of the email.
# Report -> RED issues opened/updated/closed -> free query discovery (seeded only
# from the report's measured queries; $0, no keys, no model calls) -> artifact ->
# spry-weekly-summary.json, uploaded as the artifact `spry-weekly-summary` ->
# validated commit of reports/search_outcomes/<ISO-week>.{md,json} and
# data/discovery/<ISO-week>/. NO EMAIL FROM HERE (1 Nov 2026): Boss OS sends
# the ONE "Spry Labs weekly" email at 08:15 Central with a short section from it.
#
# The summary is uploaded BEFORE the commit (11 Nov 2026). It is derived only from
# the finished report, so a validation failure, rebase conflict or lost push race
# in the commit step must not take the week's figures out of her email; it did on
# every Wednesday run 4-11 Nov (canonical-domains PREPARE write, fixed in
# scripts/validation/run_validation_registry.js). The job still goes red when the
# commit fails.
#
# Catch-up runs build any missing report. Wednesday retries can also upload the
# summary from the report already on main. Thursday through Sunday only repair
# missing reports. Monday and Tuesday are excluded to keep the report on schedule.
on:
  schedule:
    - cron: "8 0 * * 3"
    - cron: "0 5,17,20,23 * * 3"
    - cron: "30 12 * * 0,4-6"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# Shares the single main-writer group: see query-evidence-refresh.yml.
concurrency:
  group: local-guides-main-writer
  cancel-in-progress: false

env:
  NODE_OPTIONS: --max-old-space-size=3072

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      backfill: ${{ steps.guard.outputs.backfill }}
      week: ${{ steps.guard.outputs.week }}
    steps:
      - name: Choose full report or summary backfill
        id: guard
        env:
          SCHEDULE: ${{ github.event.schedule }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          week=$(date -u +%G-W%V)
          run=true
          backfill=false
          if [ "$SCHEDULE" = "0 5,17,20,23 * * 3" ] || [ "$SCHEDULE" = "30 12 * * 0,4-6" ]; then
            if gh api "repos/$REPO/contents/reports/search_outcomes/$week.json?ref=main" --silent 2>/dev/null; then
              run=false
              if [ "$SCHEDULE" = "0 5,17,20,23 * * 3" ]; then backfill=true; fi
              echo "catch-up: $week report already on main (backfill=$backfill)"
            else
              echo "catch-up: $week report missing on main; running"
            fi
          fi
          {
            echo "run=$run"
            echo "backfill=$backfill"
            echo "week=$week"
          } >> "$GITHUB_OUTPUT"
          echo "schedule='${SCHEDULE:-dispatch}' week=$week run=$run backfill=$backfill"
      - uses: actions/checkout@v7
        if: steps.guard.outputs.run == 'true'
        with:
          # validate:release resolves historic page bytes with git show; see
          # query-class-occupancy-probe.yml.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == 'true'
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        if: steps.guard.outputs.run == 'true'
        with:
          node-version: "24"
      - name: Install
        if: steps.guard.outputs.run == 'true'
        run: |
          python3 -m pip install --disable-pip-version-check google-api-python-client google-auth >/dev/null
          npm ci --ignore-scripts
      - name: Build the weekly report and sync RED issues
        id: report
        if: steps.guard.outputs.run == 'true'
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Lead funnel for memphisseniorcarehomes.com (same value as the secret of this
          # name on seq23/local-guides-generator). Absent -> the row says "funnel: no
          # token" and the run stays green.
          SENIOR_TICK_TOKEN: ${{ secrets.SENIOR_TICK_TOKEN }}
        run: python3 scripts/search_console/search_outcomes_weekly.py --mode report reports/search_outcomes
      - name: Free query discovery from measured seeds
        # Autocomplete / PAA probe / Reddit, never a paid API or a model call; a blocked
        # source is recorded as unavailable. Budget keeps the job inside its timeout.
        if: steps.guard.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEEK: ${{ steps.report.outputs.week }}
          DISCOVERY_BUDGET_SECONDS: "1500"
        run: python3 scripts/search_console/free_discovery.py "reports/search_outcomes/$WEEK.json" data/discovery
      - uses: actions/upload-artifact@v7
        if: steps.guard.outputs.run == 'true'
        with:
          name: search-outcomes-${{ steps.report.outputs.week }}-${{ github.run_id }}
          path: |
            reports/search_outcomes/${{ steps.report.outputs.week }}.*
            data/discovery/${{ steps.report.outputs.week }}/
          retention-days: 90
      - name: Hand the week to Boss OS (the Spry Labs weekly email)
        if: steps.guard.outputs.run == 'true'
        env:
          WEEK: ${{ steps.report.outputs.week }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/search_console/spry_weekly_summary.mjs --self-check
          node scripts/search_console/spry_weekly_summary.mjs "reports/search_outcomes/$WEEK.json" "$RUNNER_TEMP/spry-weekly-summary.json"
      - uses: actions/upload-artifact@v7
        if: steps.guard.outputs.run == 'true'
        with:
          name: spry-weekly-summary
          path: ${{ runner.temp }}/spry-weekly-summary.json
          if-no-files-found: error
          retention-days: 30
      - name: Commit the report
        # reports/ is gitignored repo-wide (repo-hygiene requires it); this one
        # directory is the deliberate exception, so it is added with -f.
        # Same fetch + rebase + retry shape as every other push-to-main lane,
        # and the tree is re-validated after every rebase before it is pushed.
        if: steps.guard.outputs.run == 'true'
        env:
          WEEK: ${{ steps.report.outputs.week }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp reports/search_outcomes/"$WEEK".* "$RUNNER_TEMP"/
          mkdir -p "$RUNNER_TEMP/discovery" && cp -r data/discovery/"$WEEK" data/discovery/measured_targets_snapshot.json "$RUNNER_TEMP/discovery/"
          npm run validate:release
          git add -f -- "reports/search_outcomes/$WEEK.md" "reports/search_outcomes/$WEEK.json" "data/discovery/$WEEK" data/discovery/measured_targets_snapshot.json
          if git diff --cached --quiet; then echo "no changes to commit"; exit 0; fi
          git commit -m "search outcomes weekly report + free discovery $WEEK"
          for attempt in 1 2 3; do
            # validation rewrites tracked evidence files; only the report is committed
            git reset -q --hard HEAD
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              git reset --hard origin/main
              cp "$RUNNER_TEMP/$WEEK".* reports/search_outcomes/
              mkdir -p data/discovery && cp -r "$RUNNER_TEMP/discovery/." data/discovery/
              npm run validate:release
              git add -f -- "reports/search_outcomes/$WEEK.md" "reports/search_outcomes/$WEEK.json" "data/discovery/$WEEK" data/discovery/measured_targets_snapshot.json
              if git diff --cached --quiet; then
                echo "no changes after re-deriving onto origin/main"
                exit 0
              fi
              git commit -m "search outcomes weekly report + free discovery $WEEK"
            else
              npm run validate:release
              git add -f -- "reports/search_outcomes/$WEEK.md" "reports/search_outcomes/$WEEK.json" "data/discovery/$WEEK" data/discovery/measured_targets_snapshot.json
              git commit --amend --no-edit
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 15))
          done
          exit 1


  summary_backfill:
    needs: report
    if: needs.report.outputs.backfill == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Rebuild the Boss OS summary from main
        env:
          WEEK: ${{ needs.report.outputs.week }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          node scripts/search_console/spry_weekly_summary.mjs --self-check
          node scripts/search_console/spry_weekly_summary.mjs "reports/search_outcomes/$WEEK.json" "$RUNNER_TEMP/spry-weekly-summary.json"
      - uses: actions/upload-artifact@v7
        with:
          name: spry-weekly-summary
          path: ${{ runner.temp }}/spry-weekly-summary.json
          if-no-files-found: error
          retention-days: 30
