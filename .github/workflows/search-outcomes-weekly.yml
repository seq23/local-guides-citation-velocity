name: Search Outcomes Weekly

# One place that answers "is the search work helping" across the portfolio.
# Mondays 08:00 America/Chicago: two UTC crons (13:00 in CDT, 14:00 in CST) and
# a guard step that lets only the one matching Chicago's current offset run.
# Report -> RED issues opened/updated/closed -> free query discovery (seeded only
# from the report's measured queries; $0, no keys, no model calls) -> artifact ->
# validated commit of reports/search_outcomes/<ISO-week>.{md,json} and
# data/discovery/<ISO-week>/ -> email to the owner (carries the Discovery table).
# Without RESEND_API_KEY the email step is a NAMED STOP; everything else runs.
#
# Catch-up: the Monday run is the only writer of this week's report, and the
# release gate (validate_search_outcomes_weekly_report.js) requires it on main
# from Tuesday 00:00 UTC. On 2026-10-19 the Monday run failed on an unrelated
# validator (fixed in #211 an hour later) and nothing re-ran it, so main went
# red on Tuesday for a missing 2026-W43. The catch-up crons below run ONLY when
# this ISO week's report is not on main: Monday afternoon retries land it before
# the gate turns, and the daily one repairs any week that still slipped.
on:
  schedule:
    - cron: "0 13 * * 1"
    - cron: "0 14 * * 1"
    - cron: "0 17,20,23 * * 1"
    - cron: "30 12 * * 0,2-6"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# Shares the single main-writer group: see query-evidence-refresh.yml.
concurrency:
  group: local-guides-main-writer
  cancel-in-progress: false

env:
  NODE_OPTIONS: --max-old-space-size=3072

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Guard Monday 08:00 Chicago
        id: guard
        env:
          SCHEDULE: ${{ github.event.schedule }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          offset=$(TZ=America/Chicago date +%z)
          run=true
          if [ "$SCHEDULE" = "0 13 * * 1" ] && [ "$offset" != "-0500" ]; then run=false; fi
          if [ "$SCHEDULE" = "0 14 * * 1" ] && [ "$offset" != "-0600" ]; then run=false; fi
          # Catch-up crons: run only if this ISO week's report is missing on main.
          if [ "$SCHEDULE" = "0 17,20,23 * * 1" ] || [ "$SCHEDULE" = "30 12 * * 0,2-6" ]; then
            week=$(date -u +%G-W%V)
            if gh api "repos/$REPO/contents/reports/search_outcomes/$week.json?ref=main" --silent 2>/dev/null; then
              run=false; echo "catch-up: $week report already on main"
            else
              echo "catch-up: $week report missing on main; running"
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "schedule='${SCHEDULE:-dispatch}' chicago_offset=$offset run=$run"
      - uses: actions/checkout@v7
        if: steps.guard.outputs.run == 'true'
        with:
          # validate:release resolves historic page bytes with git show; see
          # query-class-occupancy-probe.yml.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == 'true'
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        if: steps.guard.outputs.run == 'true'
        with:
          node-version: "24"
      - name: Install
        if: steps.guard.outputs.run == 'true'
        run: |
          python3 -m pip install --disable-pip-version-check google-api-python-client google-auth >/dev/null
          npm ci --ignore-scripts
      - name: Build the weekly report and sync RED issues
        id: report
        if: steps.guard.outputs.run == 'true'
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Lead funnel for memphisseniorcarehomes.com (same value as the secret of this
          # name on seq23/local-guides-generator). Absent -> the row says "funnel: no
          # token" and the run stays green.
          SENIOR_TICK_TOKEN: ${{ secrets.SENIOR_TICK_TOKEN }}
        run: python3 scripts/search_console/search_outcomes_weekly.py --mode report reports/search_outcomes
      - name: Free query discovery from measured seeds
        # Autocomplete / PAA probe / Reddit, never a paid API or a model call; a blocked
        # source is recorded as unavailable. Budget keeps the job inside its timeout.
        if: steps.guard.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEEK: ${{ steps.report.outputs.week }}
          DISCOVERY_BUDGET_SECONDS: "1500"
        run: python3 scripts/search_console/free_discovery.py "reports/search_outcomes/$WEEK.json" data/discovery
      - uses: actions/upload-artifact@v7
        if: steps.guard.outputs.run == 'true'
        with:
          name: search-outcomes-${{ steps.report.outputs.week }}-${{ github.run_id }}
          path: |
            reports/search_outcomes/${{ steps.report.outputs.week }}.*
            data/discovery/${{ steps.report.outputs.week }}/
          retention-days: 90
      - name: Commit the report
        # reports/ is gitignored repo-wide (repo-hygiene requires it); this one
        # directory is the deliberate exception, so it is added with -f.
        # Same fetch + rebase + retry shape as every other push-to-main lane,
        # and the tree is re-validated after every rebase before it is pushed.
        if: steps.guard.outputs.run == 'true'
        env:
          WEEK: ${{ steps.report.outputs.week }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp reports/search_outcomes/"$WEEK".* "$RUNNER_TEMP"/
          mkdir -p "$RUNNER_TEMP/discovery" && cp -r data/discovery/"$WEEK" data/discovery/measured_targets_snapshot.json "$RUNNER_TEMP/discovery/"
          npm run validate:release
          git add -f -- "reports/search_outcomes/$WEEK.md" "reports/search_outcomes/$WEEK.json" "data/discovery/$WEEK" data/discovery/measured_targets_snapshot.json
          if git diff --cached --quiet; then echo "no changes to commit"; exit 0; fi
          git commit -m "search outcomes weekly report + free discovery $WEEK"
          for attempt in 1 2 3; do
            # validation rewrites tracked evidence files; only the report is committed
            git reset -q --hard HEAD
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              git reset --hard origin/main
              cp "$RUNNER_TEMP/$WEEK".* reports/search_outcomes/
              mkdir -p data/discovery && cp -r "$RUNNER_TEMP/discovery/." data/discovery/
              npm run validate:release
              git add -f -- "reports/search_outcomes/$WEEK.md" "reports/search_outcomes/$WEEK.json" "data/discovery/$WEEK" data/discovery/measured_targets_snapshot.json
              if git diff --cached --quiet; then
                echo "no changes after re-deriving onto origin/main"
                exit 0
              fi
              git commit -m "search outcomes weekly report + free discovery $WEEK"
            else
              npm run validate:release
              git add -f -- "reports/search_outcomes/$WEEK.md" "reports/search_outcomes/$WEEK.json" "data/discovery/$WEEK" data/discovery/measured_targets_snapshot.json
              git commit --amend --no-edit
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 15))
          done
          exit 1
      - name: Email the report to the owner
        if: steps.guard.outputs.run == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WEEK: ${{ steps.report.outputs.week }}
        run: python3 scripts/search_console/search_outcomes_weekly.py --mode email "reports/search_outcomes/$WEEK.md"
