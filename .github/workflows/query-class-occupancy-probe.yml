name: Query Class Occupancy Probe

# Measures which citation slots are open, per query class, and COMMITS the result.
#
# Two things were wrong with the first version of this lane and both are fixed here.
#
#   1. It probed Bing. Bing serves a JavaScript shell - one b_algo node, no
#      outbound links - to residential clients AND to GitHub Actions egress. Its
#      only run discarded 16 of 16 probes, including both controls, and still
#      exited 0. The channel is now the OpenRouter web plugin, the same call the
#      citation probe uses, which is verified working from Actions.
#   2. It uploaded an artifact and committed nothing, so even a good run left
#      nothing behind for anything downstream to read. It now commits to
#      data/signals/ and the query atlas consumes that file as its winnability
#      signal.
#
# Dispatch-only, so it is not a scheduled mutator and does not consume the
# contract's single scheduled-commit slot. The scheduled path runs the same probe
# inside query-evidence-refresh.yml.
on:
  workflow_dispatch:
    inputs:
      panel:
        description: "Panel file of queries to probe"
        required: false
        default: "data/signals/query_class_probe_panel.json"
        type: string
      atlas_top:
        description: "Also measure the top N measured T1 queries from the atlas (0 to measure the panel only)"
        required: false
        default: "0"
        type: string

permissions:
  contents: write

env:
  NODE_OPTIONS: --max-old-space-size=3072

# Shares the single main-writer group: see query-evidence-refresh.yml. Four
# workflows in this repo push to main and each used to hold its own group,
# which serialises a workflow against itself and not against the branch.
concurrency:
  group: local-guides-main-writer
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history. This lane runs `npm run validate:release`, which is
          # the whole `release` profile (a strict superset of `core`), and
          # release includes historic-artifact-recovery - whose
          # validator and whose repair both resolve old page bytes with
          # `git show <historic_max_commit>:<file>`.
          #
          # This lane last ran on 2026-08-28, before those stores landed on
          # 2026-09-01, so it has not failed yet. It would have on its next run,
          # for exactly the reason Query Evidence Refresh failed on 2026-09-03:
          # under the default shallow fetch-depth: 1 every historic commit is an
          # "invalid object name" and the recovery hard-fails on a healthy tree.
          # scripts/validators/validate_lane_git_history_depth.js found this
          # before it paged anyone; do not remove the depth without removing that
          # reachability.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - name: Probe citation occupancy
        # No continue-on-error. A run that measures nothing now exits non-zero
        # instead of reporting success over an empty result set.
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/queries/probe_query_class_occupancy.mjs "${{ inputs.panel }}" data/signals/query_class_occupancy.json --atlas-top "${{ inputs.atlas_top || '0' }}" --merge
      - name: Summarise
        run: |
          node -e '
            const d=require("./data/signals/query_class_occupancy.json");
            const pad=(s,n)=>String(s).padEnd(n);
            console.log(pad("query",44),pad("slots",6),pad("open",6),pad("incumb",7),pad("instit",7),pad("unclass",8),pad("published",10));
            for(const p of d.probes) console.log(pad(p.query.slice(0,42),44),pad(p.slots_read,6),pad(p.open_share,6),pad(p.incumbent_slots,7),pad(p.institutional_slots,7),pad(p.unclassifiable_slots,8),pad(p.citation_occupancy===null?"WITHHELD":p.citation_occupancy,10));
            const s=d.summary;
            console.log("\nSLOTS:",JSON.stringify(s.slots_by_kind));
            console.log("UNCLASSIFIABLE:",s.unclassifiable_slots,"of",s.slots_read_total,"slots ("+s.unclassifiable_slot_share+") - counted CLOSED, never open");
            console.log("\nCONTROLS:",JSON.stringify(d.control_check.separation));
            console.log("SIGNAL STATUS:",d.signal_status.published?"PUBLISHED":"WITHHELD - "+d.signal_status.reason);
            if(!d.signal_status.published) console.log(d.signal_status.note);
            if(d.discarded_probes.length) console.log("\nDISCARDED (channel degraded, not zero):",d.discarded_probes.map(x=>x.query).join(" | "));
          '
      - name: Rebuild the atlas on the measured occupancy and re-derive candidates
        run: |
          npm run atlas:build
          npm run queries:join-release
      - name: Validate before recording anything
        run: |
          npm run validate:occupancy-probe
          npm run validate:occupancy-controls
          npm run validate:release
      - name: Commit the measurement
        # This step used to be stefanzweifel/git-auto-commit-action@v5: no
        # fetch, no rebase, no retry, one push. That is the identical shape
        # that broke query-evidence-refresh.yml on 2026-09-03 (run
        # 33774426877, "Your branch and 'origin/main' have diverged" ->
        # non-fast-forward reject) - this lane shares the same
        # local-guides-main-writer concurrency group and the same race window
        # against velocity-content-release.yml's own push, it had simply never
        # been dispatched while main was moving, so the defect was armed but
        # unfired. push-after-rebase-revalidates could not have caught it
        # either: that guard only examines steps whose script contains a
        # literal `git push origin HEAD:main`, and a third-party action's push
        # is invisible to it - a guard that cannot reach what it governs.
        # CONFIRMED by negative proof: before this fix, push-after-rebase-
        # revalidates examines 4 push-to-main steps across this repo; after
        # it, 5 - this lane's push was simply never in its field of view.
        #
        # This now matches every other push-to-main lane in this repo
        # (query-evidence-refresh.yml, velocity-content-release.yml,
        # velocity-full-rebuild.yml): fetch + rebase + retry, and a CONFLICT
        # is answered by resetting to the new origin/main and re-deriving this
        # run's own outputs against it before pushing - never by replaying the
        # stale commit. The occupancy probe result itself is not re-fetched:
        # data/signals/query_class_occupancy.json is this run's own measured
        # data and does not depend on what main advanced to, so only the
        # downstream, actually base-dependent steps (atlas build, release
        # join, validation) are re-run.
        env:
          file_pattern: "data/signals/query_class_occupancy.json data/authority_scale/query_atlas.json data/queries/measured_demand_candidates.json artifacts/validation/*.json"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $file_pattern
          if git diff --cached --quiet; then echo "no changes to commit"; exit 0; fi
          git commit -m "citation occupancy probe: measured winnability -> atlas"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              git reset --hard origin/main
              npm run atlas:build
              npm run queries:join-release
              npm run validate:occupancy-probe
              npm run validate:occupancy-controls
              npm run validate:release
              git add -- $file_pattern
              if git diff --cached --quiet; then
                echo "no changes to commit after re-deriving onto origin/main"
                exit 0
              fi
              git commit -m "citation occupancy probe: measured winnability -> atlas"
            else
              npm run validate:occupancy-probe
              npm run validate:occupancy-controls
              npm run validate:release
              git add -- $file_pattern
              git commit --amend --no-edit
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 15))
          done
          exit 1
