name: Medium Articles Gate

on:
  push:
    branches: [main]
    paths:
      - "medium-articles/**"
      - "scripts/validate_medium_articles.js"

permissions:
  contents: read

concurrency:
  group: medium-articles-gate
  cancel-in-progress: true

jobs:
  # MAY 2026 MAINTENANCE: Before June 2, 2026, follow README_MAY_2026_GITHUB_ACTIONS_NODE24.md
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate all medium articles
        run: node scripts/validate_medium_articles.js --all
