name: Deploy Distribution

on:
  workflow_run:
    workflows: ["Validate Repo"]
    types: [completed]
  workflow_dispatch:
    inputs:
      artifact_name:
        description: "Validated artifact name from Validate Repo"
        required: true
        type: string
      artifact_run_id:
        description: "Validate Repo workflow run ID containing the artifact"
        required: true
        type: string
      commit_sha:
        description: "Validated commit SHA"
        required: true
        type: string

permissions:
  actions: read
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=3072

concurrency:
  group: deploy-distribution
  cancel-in-progress: false

jobs:
  distribute:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve validated artifact identity
        id: artifact
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.artifact_name }}" >> "$GITHUB_OUTPUT"
            echo "run_id=${{ inputs.artifact_run_id }}" >> "$GITHUB_OUTPUT"
            echo "commit_sha=${{ inputs.commit_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=velocity-validated-${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "run_id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
            echo "commit_sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Download exact validated artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          run-id: ${{ steps.artifact.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .
      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify validation attestation and distribution inputs
        env:
          EXPECTED_COMMIT_SHA: ${{ steps.artifact.outputs.commit_sha }}
        run: node scripts/prepare_distribution_from_attestation.js
      - name: Install optional Google Search Console dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib
      - name: Restore optional Google Search Console credentials
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "${GSC_SERVICE_ACCOUNT_JSON:-}" ]; then
            printf '%s' "$GSC_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/gsc-service-account.json"
          fi
      - name: Deploy validated distribution payload
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
        run: |
          chmod +x distribution_scripts/*.sh
          if [ -f "$RUNNER_TEMP/gsc-service-account.json" ] && [ -n "${GSC_SITE_URL:-}" ]; then
            ./distribution_scripts/deploy_distribution.sh --artifact-dir .build --key "${INDEXNOW_KEY:-}" --creds "$RUNNER_TEMP/gsc-service-account.json" --gsc-site "$GSC_SITE_URL"
          else
            ./distribution_scripts/deploy_distribution.sh --artifact-dir .build --key "${INDEXNOW_KEY:-}"
          fi
      - name: Upload distribution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: velocity-distribution-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            .build/**
            reports/indexnow-*.json
            artifacts/validation/**
