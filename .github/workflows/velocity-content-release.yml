name: Velocity Content Release

on:
  push:
    branches: [main]
    paths:
      - "data/report_fixes/agent_runs/**/agent_run_manifest.json"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Maximum number of eligible governed Velocity release units to process; this is a cap, not a publication quota"
        required: false
        default: "5"
        type: string

permissions:
  contents: write

env:
  NODE_OPTIONS: --max-old-space-size=3072
  VELOCITY_RELEASE_TARGET: ${{ inputs.batch_size || '5' }}
  ALLOW_SOCIAL_FALLBACK_RELEASE: "0"

concurrency:
  group: velocity-content-release-main
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, 'snapshot update from baseline ZIP') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Synchronize source before mutation
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main
      - name: Set release date
        run: echo "SOURCE_DATE=$(date -u +%F)" >> "$GITHUB_ENV"
      - name: Run planning-only citation intelligence before Safe Harbor content release
        run: npm run release:daily-citation-intelligence:preview
      - name: Install Search Console client when credentials exist
        if: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON != '' }}
        run: python3 -m pip install --disable-pip-version-check google-api-python-client google-auth >/dev/null
      - name: Refresh measured query evidence from Search Console
        # The atlas is evidence-gated but nothing produced T1 evidence, so it ran
        # on 5 hand-seeded modelled queries. Refreshing here rather than on a
        # timer keeps maximum_scheduled_mutation_workflows at 0: evidence lands
        # through the same validated release path as everything else.
        # No credentials means the evidence file is left untouched, not emptied.
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
        run: |
          python3 scripts/queries/ingest_gsc_evidence.py
          npm run atlas:build
      - name: Absorb governed artifacts and run Safe Harbor content release
        run: npm run release:velocity-intake
      - name: Commit validated Velocity release
        id: candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git commit -m "velocity content release $(date -u +%F)"
      - name: Rebase, rebuild, revalidate, and push Velocity
        if: ${{ steps.candidate.outputs.changed == 'true' }}
        run: |
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            npm run build
            npm run validate:release
            npm run trace:agent-exact
            npm run validate:agent-exact
            npm run trace:citation-agent-fixes
            npm run validate:citation-agent-fixes
            git add -A
            git commit --amend --no-edit
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 15))
          done
          exit 1
      - name: Upload release diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: velocity-content-release-diagnostics-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            logs/**
            artifacts/validation/**
            reports/**
            data/report_fixes/normalized_agent_runs/**
            data/report_fixes/agent_exact_implementation_policy.json
            data/report_fixes/agent_exact_implementation_plan.json
            data/report_fixes/agent_exact_implementation_ledger.json
