name: Velocity Content Release

on:
  push:
    branches: [main]
    paths:
      - "data/report_fixes/agent_runs/**/agent_run_manifest.json"
      # Measured query demand is now a second, non-human path into this lane.
      # A human pushing this file triggers a release the same way a manifest
      # does; the scheduled lane cannot raise a push event with GITHUB_TOKEN, so
      # query-evidence-refresh.yml dispatches this workflow explicitly instead.
      - "data/queries/measured_demand_candidates.json"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Maximum number of eligible governed Velocity release units to process; this is a cap, not a publication quota"
        required: false
        default: "5"
        type: string

permissions:
  contents: write
  # Needed only to hand main back to Validate Repo after this workflow pushes.
  # A push made with GITHUB_TOKEN raises no push event, so the commits this
  # workflow lands can never re-run the validator that governs them; an explicit
  # workflow_dispatch is the one documented exception to that rule.
  actions: write

env:
  NODE_OPTIONS: --max-old-space-size=3072
  VELOCITY_RELEASE_TARGET: ${{ inputs.batch_size || '5' }}
  ALLOW_SOCIAL_FALLBACK_RELEASE: "0"

# Every workflow in this repo that pushes to main shares ONE group. They used
# to hold four separate ones - query-evidence-${{ github.ref }},
# velocity-content-release-main, daily-citation-intelligence-main and
# search-intelligence-closed-loop - so nothing serialised them against each
# other. On 2026-08-30 two of them overlapped and the second lost its push
# with `! [rejected] main -> main (non-fast-forward)`. A concurrency group per
# workflow protects a workflow from itself; it does not protect the branch
# they all write to.
concurrency:
  group: local-guides-main-writer
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, 'snapshot update from baseline ZIP') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # REFUSE_NON_MAIN: this lane pushes HEAD:main, so a dispatch from any other
      # ref would publish that branch to main. The push target is deliberately
      # literal - the workflow contract asserts it to prove the lane is autonomous
      # - so the ref is gated here instead of making the target dynamic.
      - name: Refuse to release from a non-main ref
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "REFUSED: this lane pushes HEAD:main; refusing to run on $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Synchronize source before mutation
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main
      - name: Set release date
        run: echo "SOURCE_DATE=$(date -u +%F)" >> "$GITHUB_ENV"
      - name: Run planning-only citation intelligence before Safe Harbor content release
        run: npm run release:daily-citation-intelligence:preview
      - name: Install Search Console client when credentials exist
        # The secrets context is not available to a step-level if:. Testing it there
        # does not evaluate false - it fails the whole workflow at startup with no
        # jobs created, which is why this workflow has never completed a run.
        # Bind the secret to env and test that instead.
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        if: ${{ env.GSC_SERVICE_ACCOUNT_JSON != '' }}
        run: python3 -m pip install --disable-pip-version-check google-api-python-client google-auth >/dev/null
      - name: Refresh measured query evidence from Search Console
        # The atlas is evidence-gated but nothing produced T1 evidence, so it ran
        # on 5 hand-seeded modelled queries. Refreshing here rather than on a
        # timer keeps maximum_scheduled_mutation_workflows at 0: evidence lands
        # through the same validated release path as everything else.
        # No credentials means the evidence file is left untouched, not emptied.
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
        run: |
          python3 scripts/queries/ingest_gsc_evidence.py
          npm run atlas:build
          npm run queries:join-release
      - name: Normalize landed agent runs and validate the absorption alone
        # Absorption used to be inseparable from the content release. Intake
        # normalized the run, but the normalized artifact was only ever pushed if
        # the whole content release also revalidated. When it did not - 2026-08-26
        # TRT, 2026-08-27 neuro, both failing on deterministic-build - the
        # normalized artifact was thrown away with the rest of the release, the raw
        # run stayed READY_FOR_ABSORPTION with no normalized output, and
        # agent-artifact-continuity held main red until a human ran the intake by
        # hand. Nothing retried, because this workflow only triggers on a new
        # manifest and that manifest had already landed.
        #
        # Normalization touches only data/report_fixes/**; it publishes no page and
        # is independently provable against the same release gate. So it lands on
        # its own validated commit first, and a later content-release failure can
        # no longer un-absorb a run that is already on disk.
        run: |
          npm run citation:prepare-velocity-intake
          npm run build
          npm run validate:release
      - name: Commit and push the validated absorption
        id: absorption
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git commit -m "absorb agent runs $(date -u +%F)"
          # The base this absorption was built and validated against. If a rebase
          # moves it, the rebased tree has to be re-derived and re-validated
          # before it may be pushed to main.
          BASE_BEFORE_REBASE="$(git rev-parse HEAD~1)"
          # The retry loop used to be unreachable. `git rebase` is a bare command
          # under `bash -e`, so a conflicting rebase killed the step on attempt 1
          # and attempts 2 and 3 never ran - 2026-08-27 died on
          # "could not apply ... absorb agent runs" with no retry and no sleep.
          #
          # Every file that conflicts here is derived: artifacts/validation/*.json
          # and content/_shared/content_state.json are outputs of the intake and
          # build below, not hand-authored state. Merging two generated versions of
          # a generated file is meaningless, so a conflict is resolved by taking
          # the newest main and re-deriving the absorption on top of it. That keeps
          # whatever the concurrent push added, which `reset --hard` before the
          # re-derive guarantees and a plain "ours" resolution would have dropped.
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              git reset --hard origin/main
              npm run citation:prepare-velocity-intake
              npm run build
              npm run validate:release
              git add -A
              if git diff --cached --quiet; then
                echo "changed=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              git commit -m "absorb agent runs $(date -u +%F)"
            elif [ "$(git rev-parse HEAD~1)" != "$BASE_BEFORE_REBASE" ]; then
              # A CLEAN rebase still produces a tree nobody validated.
              #
              # This step validated the absorption against the main it started
              # from, then rebased onto whatever main had become, then pushed.
              # A rebase that applies without conflict is not a rebase that
              # changes nothing: origin/main moved - that is why we are rebasing -
              # so the tree being pushed is a combination of two validated trees,
              # which is not itself a validated tree. The push surface here is
              # main.
              #
              # Both sibling push loops in this repo already close this: the
              # Velocity step below, and velocity-full-rebuild.yml, each re-run
              # build + validate:release after a successful rebase and amend the
              # result. This step was the only one that did not, and it is the
              # step that runs first and most often.
              #
              # Only re-derive when the base actually moved. A rebase onto the
              # same base is a no-op and re-validating it would double the
              # runtime of every clean run for nothing.
              npm run build
              npm run validate:release
              git add -A
              git commit --amend --no-edit
            fi
            if git push origin HEAD:main; then exit 0; fi
            BASE_BEFORE_REBASE="$(git rev-parse origin/main)"
            sleep $((attempt * 15))
          done
          exit 1
      - name: Absorb governed artifacts and run Safe Harbor content release
        run: npm run release:velocity-intake
      - name: Commit validated Velocity release
        id: candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git commit -m "velocity content release $(date -u +%F)"
      - name: Rebase, rebuild, revalidate, and push Velocity
        if: ${{ steps.candidate.outputs.changed == 'true' }}
        run: |
          # Same unreachable-retry defect as the absorption step: a bare `git rebase`
          # under `bash -e` ended the step on the first conflict. Aborting a failed
          # rebase leaves a clean tree so the remaining attempts can actually run.
          # This loop does not re-derive on conflict the way the absorption step
          # does, because the commit it is replaying carries published pages from
          # release:velocity-intake that a reset would discard and this step cannot
          # regenerate on its own.
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              sleep $((attempt * 15))
              continue
            fi
            npm run build
            npm run validate:release
            npm run trace:agent-exact
            npm run validate:agent-exact
            npm run trace:citation-agent-fixes
            npm run validate:citation-agent-fixes
            git add -A
            git commit --amend --no-edit
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 15))
          done
          exit 1
      - name: Re-validate main after this workflow pushes
        # The daily agent run lands on main as raw artifacts plus a manifest already
        # marked READY_FOR_ABSORPTION. The normalized artifact that satisfies
        # agent-artifact-continuity is written here, minutes later, on the absorption
        # commit. Validate Repo runs on the raw commit and correctly reports the
        # violation - but the absorption commit is pushed with GITHUB_TOKEN, which by
        # design raises no push event, so no Validate Repo run ever observes the
        # repaired state. main was therefore left showing a red guard that its own
        # HEAD already satisfies, every single day, and the registry's declared
        # velocity-content-release -> deploy-distribution edge had nothing carrying it.
        #
        # workflow_dispatch and repository_dispatch are the two events GITHUB_TOKEN is
        # still allowed to raise, so dispatching Validate Repo on main is the link that
        # lets the repair reach the guard. It re-runs the same unmodified validators
        # against the pushed HEAD: if absorption did not actually fix the state, this
        # run goes red on the same validator and nothing is hidden.
        if: ${{ always() && (steps.absorption.outputs.changed == 'true' || steps.candidate.outputs.changed == 'true') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run validate-repo.yml --ref main
      - name: Upload release diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: velocity-content-release-diagnostics-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            logs/**
            artifacts/validation/**
            reports/**
            data/report_fixes/normalized_agent_runs/**
            data/report_fixes/agent_exact_implementation_policy.json
            data/report_fixes/agent_exact_implementation_plan.json
            data/report_fixes/agent_exact_implementation_ledger.json
