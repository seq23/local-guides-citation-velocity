
name: Insights Gate

on:
  push:
    branches: [main]
    paths:
      - "insights/**"
      - "scripts/validate_insights.js"

permissions:
  contents: read

concurrency:
  group: insights-gate
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate all insights
        run: node scripts/validate_insights.js --all
