name: Daily Release
on:
  schedule:
    # Goal: consistent daily change to train crawlers + keep sitemap fresh.
    # IMPORTANT: GitHub cron is UTC and does NOT auto-adjust for daylight savings.
    # We run two schedules so you get ~8:10am Chicago time year-round:
    # - 14:10 UTC ≈ 8:10am CT (standard time)
    # - 13:10 UTC ≈ 8:10am CT (daylight savings)
    - cron: "10 14 * * *"
    - cron: "10 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-release
  cancel-in-progress: true

jobs:
  # MAY 2026 MAINTENANCE: Before June 2, 2026, follow README_MAY_2026_GITHUB_ACTIONS_NODE24.md
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Release (pages until complete, then evergreen sections)
        env:
          PAGE_BATCH: "5"
          SECTION_BATCH: "5"
        run: node scripts/daily_release.js

      - name: Build
        run: node scripts/build_site.js

      - name: Validate all medium articles
        run: node scripts/validate_medium_articles.js --all

      - name: Validate site
        run: node scripts/validate_site.js
      - name: Stage changes (for delta IndexNow)
        run: git add -A

      - name: IndexNow submit (delta)
        env:
          INDEXNOW_MODE: "delta"
        run: node scripts/indexnow_submit.js
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "daily release $(date -u +%F)" || echo "No changes to commit"
          git pull --rebase || true
          git push
