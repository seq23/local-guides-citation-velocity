name: Daily Release

on:
  schedule:
    # Goal: consistent daily change to train crawlers + keep sitemap fresh.
    # IMPORTANT: GitHub cron is UTC and does NOT auto-adjust for daylight savings.
    # We run two schedules so you get ~8:10am Chicago time year-round:
    # - 14:10 UTC ≈ 8:10am CT (standard time)
    # - 13:10 UTC ≈ 8:10am CT (daylight savings)
    - cron: "10 14 * * *"
    - cron: "10 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-release
  cancel-in-progress: true

jobs:
  # MAY 2026 MAINTENANCE: Before June 2, 2026, follow README_MAY_2026_GITHUB_ACTIONS_NODE24.md
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compile staged Reddit query clusters
        run: node scripts/compile_reddit_queries.js

      - name: Release (pages until complete, then evergreen sections)
        env:
          PAGE_BATCH: "5"
          SECTION_BATCH: "5"
          MEDIUM_BATCH: "1"
          INSIGHT_BATCH: "1"
        run: node scripts/daily_release.js

      - name: Clean build state
        run: |
          rm -rf .build


      - name: Snapshot previous published URL inventory
        run: |
          mkdir -p .build
          if [ -f content/_live/published_urls.json ]; then
            cp content/_live/published_urls.json .build/published_urls.previous.json
          fi

      - name: Build
        run: node scripts/build_site.js

      - name: Validate all medium articles
        run: node scripts/validate_medium_articles.js --all

      - name: Validate all insights
        run: node scripts/validate_insights.js --all

      - name: Validate site
        run: node scripts/validate_site.js

      - name: Validate sitemap parity
        run: node scripts/validate_sitemap_parity.js

      - name: Validate archive schema
        run: node scripts/validate_archive_schema.js

      - name: Validate publish inventory
        run: node scripts/validate_publish_inventory.js

      - name: Validate homepage schema
        run: node scripts/validate_homepage_schema.js

      - name: Validate executable bits
        run: node scripts/validate_executable_bits.js

      - name: Stage changes (for delta IndexNow)
        run: git add -A

      - name: IndexNow submit (delta)
        env:
          INDEXNOW_MODE: "delta"
        run: node scripts/indexnow_submit.js

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "daily release $(date -u +%F)" || echo "No changes to commit"
          git pull --rebase || true
          git push
