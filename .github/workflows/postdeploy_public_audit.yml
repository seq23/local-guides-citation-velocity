name: Postdeploy Public Audit

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Deployed Velocity base URL"
        required: true
        default: "https://theindustryguides.com"
        type: string

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=3072

concurrency:
  group: postdeploy-public-audit-${{ inputs.base_url }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Playwright runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run deployed click, CTA, schema, and route audit
        env:
          PLAYWRIGHT_BASE_URL: ${{ inputs.base_url }}
        run: npm run postdeploy:public-click-audit
      - name: Upload click-audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: velocity-postdeploy-audit-${{ github.run_id }}
          if-no-files-found: error
          path: artifacts/diagnostics/click-audit/**
