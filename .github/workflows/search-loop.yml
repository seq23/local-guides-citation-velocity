name: Search Loop

# The shared search growth engine (seq23/search-loop@v1), owner ruling 1 Nov 2026
# ("we just want to dominate aeo geo SEO and move fast"): find easy searches weekly,
# publish one gated short answer per search daily under /questions/ on
# theindustryguides.com, check every page at 2/4/8 weeks, strengthen / undo / merge,
# and upload the weekly report artifact "search-loop-week". New pages publish
# straight away; the old "frozen until a Search Console number" rule no longer
# applies to them.
#
# Six verticals, one site: search-loop.config.json carries the vertical map.
#   setup        scripts/search_loop/seed_topics.js feeds FIND from the measured seeds
#                free_discovery.py commits weekly (data/discovery/<week>/), Memphis
#                senior care first.
#   post-build   scripts/search_loop/fold_in.js: PI rules on accident pages, the one
#                action pointed at the matching canonical guide (else the page goes on
#                data/search-loop/missing-guides.json for local-guides-generator), the
#                /questions/ hub, admission + freeze so the build serves them.
#   commit       scripts/search_loop/commit.sh: build, validate:release, push; nothing
#                is pushed unless the release profile passes on the exact tree.
# local-guides-generator reads data/search-loop/ here (shares_audience_with), and this
# config reads its ledger, so the two never target the same search.
# Throttle every site at once: gh variable set SEARCH_LOOP_MODE --body slow -R seq23/search-loop
on:
  schedule:
    - cron: "47 13 * * *"  # 13:47 UTC: its own minute (11:41 is sprylabs-hpc-site, 12:53 hicks-consulting-canonical); before local-guides-generator (15:41) reads this ledger
  workflow_dispatch:
    inputs:
      stage:
        description: "auto | find | build | check"
        required: false
        default: auto
        type: string

permissions:
  contents: write
  actions: write

# Shares the single main-writer group: see query-evidence-refresh.yml.
concurrency:
  group: local-guides-main-writer
  cancel-in-progress: false

jobs:
  search-loop:
    # Search rescue: expansion is still paused, but the job no longer sits behind
    # `if: ${{ false }}`. Disabling it outright also stopped the MEASURING, and the
    # week report is the only place two Search Readiness items are read from: f8
    # (the outcome-gated cap) and f11 (AI-referral visits and AI-bot reads). The
    # report froze at 2026-W45 and both items failed for want of a number nobody
    # was collecting - a paused job reported as a site defect.
    #
    # So this site runs MEASURE-ONLY. `stage: check` runs the check phase alone
    # (bin/search-loop.mjs: FIND is gated on stage find|auto|build, BUILD on
    # auto|build), so nothing is discovered and nothing is published, and the week
    # report is still written with cap, held_by_cap, redirected, ai_visitors and
    # ai_bot_hits. Two further brakes stay on underneath it: search-loop.config.json
    # sets cap.max_live_pages to the 13 pages already live, so room is 0 and BUILD
    # would publish nothing even if it ran, and the engine only publishes from the
    # default branch. A deliberate `workflow_dispatch` with stage=auto is the escape
    # hatch for whoever lifts the rescue; the schedule never takes it.
    uses: seq23/search-loop/.github/workflows/search-loop.yml@v1
    with:
      engine_ref: v1
      stage: ${{ inputs.stage || 'check' }}
      setup_command: npm ci --ignore-scripts && node scripts/search_loop/seed_topics.js
      node_options: --max-old-space-size=3072
      post_build_command: node scripts/search_loop/fold_in.js
      commit_command: bash scripts/search_loop/commit.sh
    secrets:
      BOSS_OPEN_LOOPS_TOKEN: ${{ secrets.BOSS_OPEN_LOOPS_TOKEN }}  # named stops -> Boss OS Open Loops (search-loop v1.7.0)
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
      GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      # $0 model lanes (engine v1.2.3): Gemini free tier (no-billing project), metered Workers AI
      # (usage read with the analytics token, model run with the Workers AI token; 600 neurons/day).
      #
      # f11: use the analytics reader, not the Workers AI usage token. Live
      # proof on 3 Nov 2026 returned AI-bot counts and Web Analytics referrals;
      # the usage token could find the zone but was refused Analytics:Read.
      # The dedicated secret is populated from the existing Boss OS vault key
      # CLOUDFLARE_ANALYTICS_READ_TOKEN. Missing/refused reads remain "not read",
      # never a fabricated zero. The Workers AI execution credential stays below.
      CLOUDFLARE_API_TOKEN: ${{ secrets.SEARCH_LOOP_CF_ANALYTICS_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.SEARCH_LOOP_CF_ACCOUNT_ID }}
      CLOUDFLARE_WORKERS_AI_TOKEN: ${{ secrets.SEARCH_LOOP_CF_WORKERS_AI_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.SEARCH_LOOP_GEMINI_API_KEY }}
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
