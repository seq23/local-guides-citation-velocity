name: Release Batch
on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "How many staged pages to add to LIVE"
        required: true
        default: "5"

permissions:
  contents: write

concurrency:
  group: release-batch
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Release batch
        run: node scripts/release_batch.js "${{ inputs.batch_size }}"

      - name: Build
        run: node scripts/build_site.js

      - name: Validate (warnings only)
        run: node scripts/validate_site.js

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "release batch (${{ inputs.batch_size }}) $(date -u +%F)" || echo "No changes to commit"
          git pull --rebase || true
          git push
