name: Validate Repo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=3072
  # The release profile is ~180 validators and 7-11 minutes on one runner; two of
  # them (the clock-independence pair) are more than half of that. This is the
  # merge gate, so it runs as SHARD_COUNT parallel slices balanced by measured
  # duration (run_validation_registry.js --shard) and one aggregate job that proves
  # every validator was assigned exactly once and passed
  # (merge_validation_shards.js). Change the count here AND in the matrix below.
  SHARD_COUNT: "4"

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shard:
    name: shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    # Measured on run 40261574048: the slowest shard is 3.1 minutes (15s checkout,
    # 50s gate+preview, 113s build + its slice). The ceiling is a fault detector,
    # not a budget, so ~2.5x that - 15 minutes let a hung job burn five times the
    # normal run before anyone saw it.
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history stays: the attestation reads it and
          # validate_lane_git_history_depth requires fetch-depth: 0 on any workflow
          # that can reach a history-reading script. Historic BLOBS are fetched on
          # demand instead - nothing in the release or advisory profile reads the
          # bytes of an old commit, and this repo rewrites ~2,100 HTML pages per
          # release, so those blobs were most of the checkout. Search Readiness h5.
          fetch-depth: 0
          filter: blob:none
      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Build strategy gate and daily citation preview
        # One line, not two: release:daily-citation-intelligence:preview begins with
        # `npm run strategy:gate`, so running it first ran the 100k runway build twice
        # in every one of the five jobs - about 25 seconds each, twice over on the
        # critical path (a shard, then the aggregate). Search Readiness h5.
        run: npm run release:daily-citation-intelligence:preview
      - name: Build and validate this shard of the release profile
        env:
          VALIDATION_SHARD: ${{ matrix.shard }}/${{ env.SHARD_COUNT }}
        run: npm run release:ci-validate
      - name: Upload shard evidence
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: validation-shard-${{ matrix.shard }}-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 3
          path: |
            artifacts/validation/**
            !artifacts/validation/runtime/**
            !artifacts/validation/release-pipeline-checkpoint.json
            !artifacts/validation/release-pipeline-report.json
      - name: Upload shard diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: velocity-validation-diagnostics-shard-${{ matrix.shard }}-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            logs/**
            artifacts/validation/**
            reports/**

  validate:
    needs: shard
    runs-on: ubuntu-latest
    # Measured on run 40261574048: 2.2 minutes (16s checkout, 39s gate+preview,
    # 53s merge and tail stages, 11s artifact upload). ~2.7x that.
    timeout-minutes: 6
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history stays: the attestation reads it and
          # validate_lane_git_history_depth requires fetch-depth: 0 on any workflow
          # that can reach a history-reading script. Historic BLOBS are fetched on
          # demand instead - nothing in the release or advisory profile reads the
          # bytes of an old commit, and this repo rewrites ~2,100 HTML pages per
          # release, so those blobs were most of the checkout. Search Readiness h5.
          fetch-depth: 0
          filter: blob:none
      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Build strategy gate and daily citation preview
        # One line, not two: release:daily-citation-intelligence:preview begins with
        # `npm run strategy:gate`, so running it first ran the 100k runway build twice
        # in every one of the five jobs - about 25 seconds each, twice over on the
        # critical path (a shard, then the aggregate). Search Readiness h5.
        run: npm run release:daily-citation-intelligence:preview
      - name: Download shard evidence
        uses: actions/download-artifact@v7
        with:
          pattern: validation-shard-*-${{ github.run_id }}
          path: ${{ runner.temp }}/shards
      - name: Overlay shard evidence
        # Every shard's evidence files land in artifacts/validation so the
        # evidence, manifest and attestation stages see the whole profile.
        # The per-shard summaries are what merge_validation_shards.js reads.
        run: |
          set -euo pipefail
          n=0
          for d in "${RUNNER_TEMP}"/shards/validation-shard-*; do
            [ -d "$d" ] || continue
            cp -R "$d"/. artifacts/validation/
            n=$((n + 1))
          done
          echo "overlaid $n shard(s)"
          [ "$n" = "$SHARD_COUNT" ] || { echo "::error::expected $SHARD_COUNT shard artifact(s), found $n"; exit 1; }
          ls artifacts/validation/validation-summary-shard-*.json
      - name: Build, merge the shards and validate exact artifact in bounded stages
        env:
          VALIDATION_MERGE_SHARDS: ${{ env.SHARD_COUNT }}
        run: npm run release:ci-validate
      - name: Upload exact validated artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: velocity-validated-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
          path: |
            .
            !.git/**
            !node_modules/**
            !dist/**
            !reports/**
            !logs/**
            !artifacts/diagnostics/**
      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: velocity-validation-diagnostics-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            logs/**
            artifacts/validation/**
            reports/**
      - name: Cadence gate
        # Blocks publishing faster than the library can be kept inside the
        # 91-day window where pages stay citable. Warnings are reported
        # without failing the run.
        run: |
          npm run cadence:gate
          npm run cadence:template-share
