name: Validate Repo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # Shard 0 lists this run's artifacts and jobs to wait for its sibling's evidence
  # (scripts/ci/wait_for_shard_evidence.js).
  actions: read

env:
  NODE_OPTIONS: --max-old-space-size=3072
  # OUTSIDE the working tree, deliberately, and a literal path because neither
  # workflow-level nor job-level env may read the `runner` context. The default is
  # a gitignored .build-cache/ in the repo root, which is fine for a developer but
  # not for a lane that walks the repo: a cache entry holds a copy of the rendered
  # tree, and search-quality-basics read those copies as duplicate indexable
  # content and failed the whole gate. Gitignoring a directory does not hide it
  # from a filesystem walker. Keeping the store off the tree means no validator can
  # ever see it, whatever a future walker's skip list says. Search Readiness h5.
  BUILD_CACHE_DIR: /tmp/velocity-build-cache
  # This is the merge gate, so it runs the release profile as SHARD_COUNT parallel
  # slices balanced by measured duration (run_validation_registry.js --shard), and
  # shard 0 then proves every validator was assigned exactly once and passed
  # (merge_validation_shards.js). Change the count here AND in the matrix below.
  #
  # TWO shards, and no separate aggregate job (Search Readiness h5, 24 Nov 2026).
  # The profile is 26 validators and ~105s of measured work, 75s of it ONE
  # validator (canonical-data-immutability), so shard 0 is that validator alone at
  # any count and four shards were no faster than two. What four shards plus a
  # `needs: shard` aggregate DID cost was runner queueing: each of five jobs had
  # to win a hosted runner from the account's shared pool, and the aggregate had to
  # win one after every shard finished. Runs 45061119735 and 45033168692: shards of
  # 70-135s, one shard queued 5.5 minutes behind its siblings, the aggregate queued
  # 2.5 and 4 minutes, and 14 and 17 minutes of wall clock for ~4 of work. Now two
  # jobs ask for runners, both at the start, and shard 0, which already holds one,
  # merges in place.
  SHARD_COUNT: "2"

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shard:
    name: shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    # Measured on run 45061119735: the slowest shard is 2.3 minutes. The ceiling is
    # a fault detector, not a budget, so ~3x that. Shard 0 also waits for shard 1
    # (bounded at 10 minutes by SHARD_WAIT_SECONDS, which covers a sibling that
    # queued for a runner) and then merges (~1 minute), so it gets the wait on top.
    timeout-minutes: ${{ matrix.shard == 0 && 18 || 8 }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history stays: the attestation reads it and
          # validate_lane_git_history_depth requires fetch-depth: 0 on any workflow
          # that can reach a history-reading script. Historic BLOBS are fetched on
          # demand instead - nothing in the release or advisory profile reads the
          # bytes of an old commit, and this repo rewrites ~2,100 HTML pages per
          # release, so those blobs were most of the checkout. Search Readiness h5.
          fetch-depth: 0
          filter: blob:none
      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Five-vertical canonical routing regression
        if: matrix.shard == 1
        run: node scripts/tests/test_five_vertical_routing_coverage.js
      - name: Search loop fold-in behaviour (PI rules, guide match, missing guides)
        if: matrix.shard == 1
        run: node scripts/tests/test_search_loop_fold_in.js
      - name: Search rescue behaviour
        if: matrix.shard == 1
        run: node scripts/tests/test_search_rescue.js
      - name: Comparison pages carry page-specific slot text (Search Readiness q1)
        if: matrix.shard == 1
        run: node scripts/tests/test_disambiguator_specifics.js
      - name: Mutation scope puts a retired thawed route back as frozen
        if: matrix.shard == 1
        run: node scripts/tests/test_mutation_scope_retired.js
      - name: Validation runner attributes a PREPARE's declared writes to the PREPARE
        if: matrix.shard == 1
        run: node scripts/tests/test_validation_mutation_guard.js
      - name: Shard 0 merges only whole, passing shard evidence
        if: matrix.shard == 1
        run: node scripts/tests/test_wait_for_shard_evidence.js
      - name: Restore the build-result cache
        # The lane's site-build stage runs `npm run build:cached`, so this is what
        # makes it a no-op. The prefix restore-key lets a rebase retry or a re-run
        # whose hashed input surface did not move hit a previous run's entry; the
        # wrapper verifies every entry against its own input hash and falls back to
        # a real build on any doubt, so a stale or wrong-commit restore cannot be
        # used. Within this run, shard 0's merge reuses the entry its own
        # site-build stage wrote to the same store on the same runner, instead of
        # rebuilding all ~2,400 pages a second time in series. Search Readiness h5.
        uses: actions/cache/restore@v4
        with:
          path: /tmp/velocity-build-cache
          key: build-cache-v1-${{ github.sha }}
          restore-keys: |
            build-cache-v1-
      - name: Build strategy gate and daily citation preview
        # ONE job, not all five. It takes ~50s and it was on the critical path
        # twice over (the slowest shard, then the aggregate that waits on it) -
        # about 100 of the gate's 370 seconds. Measured, run 40290310511: every
        # shard and the aggregate pass with this step skipped, because the
        # validators that read its output read the artifacts the repo COMMITS;
        # re-deriving them inside the gate is also the shape validation-lane-
        # repairs-nothing exists to discourage. It stays on one shard so the daily
        # citation lane is still exercised on every PR rather than quietly
        # untested, and shard 1 is chosen because the balancer leaves it light
        # (the heaviest validator lands alone on shard 0). Search Readiness h5.
        if: matrix.shard == 1
        run: npm run release:daily-citation-intelligence:preview
      - name: Build and validate this shard of the release profile
        env:
          VALIDATION_SHARD: ${{ matrix.shard }}/${{ env.SHARD_COUNT }}
        run: npm run release:ci-validate
      - name: Save the build-result cache
        # One shard saves, not all of them: a single key written by SHARD_COUNT
        # parallel jobs is a race, and the post-step form would run it in every one.
        # Shard 1, because shard 0 is the critical path (the balancer,
        # run_validation_registry.js longest-weight-first, puts the heaviest
        # validator alone on it, and it then waits and merges). Each shard job
        # prints its own assignment ("VALIDATION SHARD i/N: ... heaviest <id> <n>s"),
        # so a weight change that moves the heavy work onto shard 1 is visible.
        #
        # cache:prune-store touches only the store and does NOT build.
        # `build:cached:prune` was the obvious call and cost 80 seconds on the
        # critical path (measured, run 40290310511): it recomputes the input hash,
        # the lane's later stages have already moved it, so it missed its own
        # entry and ran a whole second build in order to prune. Keeping the newest
        # entry (~77 MB) is what stops the store growing without bound across
        # runs. Search Readiness h5.
        if: success() && matrix.shard == 1
        run: npm run cache:prune-store
      - name: Store the build-result cache
        if: success() && matrix.shard == 1
        uses: actions/cache/save@v4
        with:
          path: /tmp/velocity-build-cache
          key: build-cache-v1-${{ github.sha }}
      - name: Upload shard evidence
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: validation-shard-${{ matrix.shard }}-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 3
          path: |
            artifacts/validation/**
            !artifacts/validation/runtime/**
            !artifacts/validation/release-pipeline-checkpoint.json
            !artifacts/validation/release-pipeline-report.json
      - name: Upload shard diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: velocity-validation-diagnostics-shard-${{ matrix.shard }}-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            logs/**
            artifacts/validation/**
            reports/**

      # ---- Shard 0 only, from here: the aggregate, in place. -------------------
      - name: Wait for every shard's evidence
        # Fails closed: a sibling that ends in anything but success fails this
        # step at once, and so does the 10-minute deadline.
        if: success() && matrix.shard == 0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHARD_WAIT_SECONDS: "600"
        run: node scripts/ci/wait_for_shard_evidence.js
      - name: Return to the clean checkout
        # The merge must start where a fresh aggregate job started: the committed
        # tree, plus every shard's evidence and nothing else. This shard's own run
        # left its own checkpoint, logs, dist/ and rewritten artifacts behind, so
        # reset to HEAD and drop every untracked and ignored file except the
        # installed dependencies. Its evidence comes back with the others' below.
        # The build-result store lives outside the checkout, so it survives.
        if: success() && matrix.shard == 0
        run: |
          git reset --hard -q HEAD
          git clean -ffdxq -e node_modules
          git status --short
      - name: Download shard evidence
        if: success() && matrix.shard == 0
        uses: actions/download-artifact@v7
        with:
          pattern: validation-shard-*-${{ github.run_id }}
          path: ${{ runner.temp }}/shards
      - name: Overlay shard evidence
        # Every shard's evidence files land in artifacts/validation so the
        # evidence, manifest and attestation stages see the whole profile.
        # The per-shard summaries are what merge_validation_shards.js reads.
        if: success() && matrix.shard == 0
        run: |
          set -euo pipefail
          n=0
          for d in "${RUNNER_TEMP}"/shards/validation-shard-*; do
            [ -d "$d" ] || continue
            cp -R "$d"/. artifacts/validation/
            n=$((n + 1))
          done
          echo "overlaid $n shard(s)"
          [ "$n" = "$SHARD_COUNT" ] || { echo "::error::expected $SHARD_COUNT shard artifact(s), found $n"; exit 1; }
          ls artifacts/validation/validation-summary-shard-*.json
      - name: Build, merge the shards and validate exact artifact in bounded stages
        id: merge
        if: success() && matrix.shard == 0
        env:
          VALIDATION_MERGE_SHARDS: ${{ env.SHARD_COUNT }}
        run: npm run release:ci-validate
      - name: Upload exact validated artifact
        if: success() && matrix.shard == 0
        uses: actions/upload-artifact@v7
        with:
          name: velocity-validated-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
          path: |
            .
            !.git/**
            !node_modules/**
            !dist/**
            !reports/**
            !logs/**
            !artifacts/diagnostics/**
      - name: Upload validation diagnostics
        if: always() && matrix.shard == 0 && steps.merge.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: velocity-validation-diagnostics-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            logs/**
            artifacts/validation/**
            reports/**
      - name: Cadence gate
        # Blocks publishing faster than the library can be kept inside the
        # 91-day window where pages stay citable. Warnings are reported
        # without failing the run.
        if: success() && matrix.shard == 0
        run: |
          npm run cadence:gate
          npm run cadence:template-share
