name = "local-guides-citation-velocity"
pages_build_output_dir = "dist"
compatibility_date = "2026-07-24"

# Because this file exists, Cloudflare Pages treats it as the source of truth
# for configuration and drops any plain-text variable set through the
# dashboard or API on the next build. Setting AIRTABLE_BASE_ID and friends
# through the API looked like it worked -- the API echoed them back and a
# re-read confirmed them -- and then every deployment silently wiped them,
# which is why /api/request-assistance answered 503 while the five vertical
# sites (which have no wrangler.toml) were fine on the identical handler.
# Non-secret lead-capture config therefore lives here, in version control.
#
# AIRTABLE_API_TOKEN is deliberately absent: secrets are not managed by this
# file, so it stays an encrypted Pages secret and survives these builds.
# RESEND_API_KEY is likewise an encrypted Pages secret (the Resend account that
# holds theindustryguides.com). The sender is not configured here at all: the
# handler pins it to The Industry Guides <hello@theindustryguides.com>, so no
# config value can put another company's sender on a lead email.
[vars]
AIRTABLE_BASE_ID = "appDgpv4F5ORCtUU3"
AIRTABLE_TABLE_NAME = "Lead Requests"
AIRTABLE_CLICKS_TABLE_NAME = "Lead Clicks"
# One address by the owner's call. Airtable is the system of record and this
# email is a notification copy, so a second inbox buys redundancy that Airtable
# already provides. The handler still accepts a comma-separated list if that
# ever changes.
LEAD_TO = "info@spryvc.com"
SITE_URL = "https://theindustryguides.com"
